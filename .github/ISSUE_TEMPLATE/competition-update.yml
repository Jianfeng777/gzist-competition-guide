name: 补充或更新赛事
description: 提交学校目录变更、主办方资料、官网、报名月份或报名入口
title: "[赛事更新] "
body:
  - type: input
    id: name
    attributes:
      label: 赛事名称
      placeholder: 请填写完整名称
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: 主办方官方页面（如有）
      description: 未找到可留空；不接受学校喜报、转载文章或搜索结果页作为官网
      placeholder: https://
  - type: input
    id: registration
    attributes:
      label: 官方报名入口（如有）
      description: 没有独立报名入口可留空
      placeholder: https://
  - type: dropdown
    id: year
    attributes:
      label: 页面明确对应的届次
      options:
        - "2026"
        - "2026—2027"
        - "2027"
        - "往届参考"
        - "暂未确认"
    validations:
      required: true
  - type: textarea
    id: dates
    attributes:
      label: 报名与比赛时间
      placeholder: 请写明可确认的日期，并注明是当届时间还是往届参考
  - type: input
    id: catalog
    attributes:
      label: 学校目录等级与序号（如有）
      placeholder: 例如 A-03、C-12
  - type: textarea
    id: content
    attributes:
      label: 比赛内容或准备资料
      placeholder: 可补充比赛做什么、常见题目或作品形式、适合哪些学生、如何准备
