name: Monthly competition review

on:
  schedule:
    - cron: "20 9 1 * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate the full school catalog
        run: |
          node scripts/build-catalog.mjs
          node scripts/validate-catalog.mjs

      - name: Check official and registration links
        id: links
        continue-on-error: true
        run: node scripts/check-links.mjs --report link-audit.md

      - name: Create or update monthly review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          review_month="$(TZ=Asia/Shanghai date +'%Y-%m')"
          title="月度赛事更新检查 ${review_month}"
          {
            echo "# ${title}"
            echo
            echo "请按以下顺序人工复核："
            echo
            echo "- [ ] 对照学校最新竞赛目录，确认 204 项清单是否新增、改名或调整等级"
            echo "- [ ] 逐项确认是否出现新的当届或下一届官方通知"
            echo "- [ ] 已开放报名的项目补充主办方官方报名入口"
            echo "- [ ] 已关闭报名的项目改为不可点击，并写明当届结果或下次建议查看时间"
            echo "- [ ] 更新报名月份；当届已核实与往届参考必须分开标注"
            echo "- [ ] 复核 A+、A、B+、B、C 五个等级的官网、报名入口和赛事简介"
            echo "- [ ] 未找到官网或当届信息的项目继续保留，只关闭入口并写清状态"
            echo "- [ ] 修改 data/ 中的源数据后，运行构建与校验生成 site/data.js"
            echo
            cat link-audit.md
          } > monthly-review.md

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file monthly-review.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file monthly-review.md
          fi

      - name: Mark hard link failures
        if: steps.links.outcome == 'failure'
        run: exit 1
