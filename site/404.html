<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="1; url=https://jianfeng777.github.io/gzus-competition-guide/">
  <link rel="canonical" href="https://jianfeng777.github.io/gzus-competition-guide/">
  <title>网站已迁移｜广州软件学院竞赛清单</title>
  <script>
    (() => {
      const oldPrefix = "/gzist-competition-guide";
      const suffix = window.location.pathname.startsWith(oldPrefix)
        ? window.location.pathname.slice(oldPrefix.length)
        : "/";
      const target = new URL("https://jianfeng777.github.io/gzus-competition-guide/");
      target.pathname = "/gzus-competition-guide" + (suffix || "/");
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>网站已迁移至 <a href="https://jianfeng777.github.io/gzus-competition-guide/">GZUS 竞赛清单</a>。</p>
</body>
