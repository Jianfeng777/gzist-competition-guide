<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b3d">
  <meta name="description" content="按 A+、A、B+、B、C 等级浏览广州软件学院竞赛目录全部赛事，并按专业方向和赛事类型筛选。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="竞赛清单｜广州软件学院">
  <meta property="og:description" content="按等级浏览学校竞赛目录全部 204 项赛事。">
  <meta property="og:url" content="https://jianfeng777.github.io/gzist-competition-guide/competitions.html">
  <link rel="canonical" href="https://jianfeng777.github.io/gzist-competition-guide/competitions.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>竞赛清单｜广州软件学院</title>
</head>
<body data-page="competitions">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true"><img src="assets/gzist-emblem.png" alt=""></span>
        <span class="brand-copy"><strong>广州软件学院竞赛清单</strong><small>面向全校学生</small></span>
      </a>
      <button class="nav-toggle icon-button" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">打开导航</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="primary-nav" id="primary-nav" aria-label="主导航"><a href="index.html" data-nav="home">首页</a><a href="competitions.html" data-nav="competitions">竞赛清单</a><a href="calendar.html" data-nav="calendar">报名月历</a></nav>
      <button class="share-button" id="share-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg><span>分享</span></button>
    </div>
  </header>

  <main id="main-content">
    <section class="page-intro shell">
      <h1>学校竞赛目录</h1>
      <p>按学校目录等级查看全部赛事。类型、入口和关键词筛选不会移除未核实官网的项目。</p>
      <div class="source-line"><span id="catalog-edition">2026年试行版</span><span>共 <strong id="catalog-total">204</strong> 项</span></div>
    </section>

    <section class="catalog-shell shell" aria-labelledby="catalog-title">
      <h2 class="sr-only" id="catalog-title">竞赛清单</h2>
      <div class="level-tabs" id="level-tabs" role="tablist" aria-label="按等级筛选">
        <button type="button" role="tab" data-level="all" aria-selected="true">全部 <small>204</small></button>
        <button type="button" role="tab" data-level="A+">A+ <small>11</small></button>
        <button type="button" role="tab" data-level="A">A <small>46</small></button>
        <button type="button" role="tab" data-level="B+">B+ <small>64</small></button>
        <button type="button" role="tab" data-level="B">B <small>46</small></button>
        <button type="button" role="tab" data-level="C">C <small>37</small></button>
      </div>

      <div class="catalog-toolbar">
        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <span class="sr-only">搜索赛事</span>
          <input id="search-input" type="search" placeholder="搜索比赛名称、主办方或方向" autocomplete="off">
        </label>
        <div class="filter-row" aria-label="赛事筛选">
          <label><span>专业方向</span><select id="category-filter"><option value="all">全部方向</option></select></label>
          <label><span>赛事类型</span><select id="type-filter"><option value="all">全部类型</option></select></label>
          <label><span>入口状态</span><select id="link-filter"><option value="all">全部入口状态</option><option value="official">有核验官网</option><option value="registration">当前可报名</option><option value="missing">暂无核验入口</option></select></label>
          <button class="subtle-button" id="reset-filters" type="button">重置筛选</button>
        </div>
      </div>

      <div class="result-bar"><p id="result-summary">正在读取清单…</p><label>每页显示 <select id="page-size"><option value="20">20 项</option><option value="40">40 项</option><option value="80">80 项</option></select></label></div>
      <div class="catalog-table" role="table" aria-label="学校竞赛目录">
        <div class="catalog-header" role="row"><span>等级</span><span>竞赛名称</span><span>方向与类型</span><span>主办方</span><span>入口</span><span>操作</span></div>
        <div class="catalog-results" id="competition-list" role="rowgroup" aria-live="polite"></div>
      </div>
      <div class="empty-state" id="empty-state" hidden><h3>没有找到匹配的比赛</h3><p>试试清空关键词或切换筛选条件。</p><button class="button button-secondary" id="empty-reset" type="button">清空筛选</button></div>
      <nav class="pagination" id="pagination" aria-label="赛事清单分页"></nav>
    </section>
  </main>

  <footer class="site-footer"><div class="shell footer-inner"><div><strong>广州软件学院竞赛清单</strong><p>完整收录学校竞赛目录中的项目。</p></div><p>具体安排以学校通知和主办方信息为准。</p></div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">此页面需要启用 JavaScript 才能筛选完整清单。</p></noscript>
  <script src="data.js"></script><script src="site.js"></script><script src="competitions.js"></script>
</body>
</html>
