<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b3d">
  <meta name="description" content="按报名月份查看广州软件学院竞赛目录赛事；当届已核实时间与往届常见时间分开标注。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="报名月历｜广州软件学院竞赛清单">
  <meta property="og:description" content="按报名月份查看赛事，提前安排组队和准备。">
  <meta property="og:url" content="https://jianfeng777.github.io/gzist-competition-guide/calendar.html">
  <link rel="canonical" href="https://jianfeng777.github.io/gzist-competition-guide/calendar.html">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260801-2">
  <title>报名月历｜广州软件学院竞赛清单</title>
</head>
<body data-page="calendar">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" aria-label="返回首页"><span class="brand-mark" aria-hidden="true"><img src="assets/gzist-emblem.png" alt=""></span><span class="brand-copy"><strong>广州软件学院竞赛清单</strong><small>面向全校学生</small></span></a>
      <button class="nav-toggle icon-button" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">打开导航</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="primary-nav" id="primary-nav" aria-label="主导航"><a href="index.html" data-nav="home">首页</a><a href="competitions.html" data-nav="competitions">竞赛清单</a><a href="calendar.html" data-nav="calendar">报名月历</a></nav>
      <button class="share-button" id="share-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg><span>分享</span></button>
    </div>
  </header>

  <main id="main-content">
    <section class="page-intro shell">
      <h1>按报名月份提前准备</h1>
      <p>“2026已核实”表示找到当届官方时间；“往届参考”只用于安排准备，报名时仍需查看新通知。</p>
      <div class="legend"><span><i class="status-dot verified"></i>2026已核实</span><span><i class="status-dot reference"></i>往届参考</span><span><i class="status-dot unknown"></i>时间待确认</span></div>
    </section>

    <section class="calendar-shell shell" aria-labelledby="calendar-title">
      <h2 class="sr-only" id="calendar-title">报名月份列表</h2>
      <div class="month-tabs" id="month-tabs" role="tablist" aria-label="选择报名月份"></div>
      <div class="catalog-toolbar calendar-toolbar">
        <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">搜索赛事</span><input id="calendar-search" type="search" placeholder="搜索比赛名称、主办方或方向" autocomplete="off"></label>
        <div class="filter-row">
          <label><span>等级</span><select id="calendar-level"><option value="all">全部等级</option><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option></select></label>
          <label><span>专业方向</span><select id="calendar-category"><option value="all">全部方向</option></select></label>
          <label><span>时间依据</span><select id="calendar-kind"><option value="all">全部时间依据</option><option value="verified_2026">2026已核实</option><option value="historical">往届参考</option><option value="unknown">时间待确认</option></select></label>
          <button class="subtle-button" id="calendar-reset" type="button">重置筛选</button>
        </div>
      </div>
      <div class="calendar-heading"><div><strong id="selected-month-title">本月报名清单</strong><span id="calendar-summary">正在读取时间信息…</span></div><button class="subtle-button" id="unknown-time-button" type="button">查看时间待确认</button></div>
      <div class="calendar-results" id="calendar-results" aria-live="polite"></div>
      <div class="empty-state" id="calendar-empty" hidden><h3>这个月份暂时没有匹配项目</h3><p>可切换时间依据或查看“时间待确认”的赛事。</p></div>
    </section>
  </main>

  <footer class="site-footer"><div class="shell footer-inner"><div><strong>广州软件学院竞赛清单</strong><p>报名时间按证据等级区分展示。</p></div><p>历史时间不能替代当届通知；最终以学校和主办方信息为准。</p></div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">此页面需要启用 JavaScript 才能按月份筛选。</p></noscript>
  <script src="data.js"></script><script src="site.js"></script><script src="calendar.js"></script>
</body>
</html>
